name: Сборка Сократа

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash  # bash -eo pipefail: ошибка в конвейере с tee роняет шаг

env:
  HF_MODEL: facebook/nllb-200-distilled-1.3B

jobs:
  model:
    name: Модель NLLB-200 → CTranslate2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: model
          key: nllb-1.3B-ct2-int8-${{ hashFiles('scripts/convert_model.sh') }}

      - name: Конвертация
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/convert_model.sh model "$HF_MODEL"

      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: model
          retention-days: 2
          compression-level: 0

  app:
    name: Приложение (${{ matrix.arch }})
    needs: model
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: model

      - name: Встроенный Python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          scripts/bundle_python.sh build/python 2>&1 | tee -a build/ci.log

      - name: Сборка приложения
        run: |
          VERSION="$(cat VERSION)" scripts/build_app.sh build/python model build 2>&1 | tee -a build/ci.log

      - name: Проверка перевода
        run: scripts/smoke_test.sh "build/Сократ.app" 2>&1 | tee -a build/ci.log

      - name: DMG
        run: scripts/make_dmg.sh "build/Сократ.app" "build/Sokrat-${{ matrix.arch }}.dmg" 2>&1 | tee -a build/ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: Sokrat-${{ matrix.arch }}
          path: build/Sokrat-${{ matrix.arch }}.dmg
          compression-level: 0

      - name: Ошибки сборки — в сводку
        if: failure()
        run: |
          [[ -f build/ci.log ]] || exit 0
          grep -E "error|Error|ERROR|failed|Traceback|No such" build/ci.log | head -40 > build/err.txt || true
          [[ -s build/err.txt ]] || tail -40 build/ci.log > build/err.txt
          msg="$(sed -e 's/%/%25/g' build/err.txt | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Лог сборки::$msg"

  windows:
    name: Windows (x64)
    needs: model
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: model

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Зависимости
        run: |
          mkdir -p build
          python -m pip install --upgrade pip 2>&1 | tee -a build/ci.log
          python -m pip install -r windows/requirements.txt pyinstaller 2>&1 | tee -a build/ci.log

      - name: Проверка из исходников
        run: |
          status=0
          python windows/sokrat_win.py --selftest --model model --report build/selftest-src.txt || status=$?
          cat build/selftest-src.txt | tee -a build/ci.log
          exit $status

      - name: Сборка Sokrat.exe
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name Sokrat \
            --icon windows/assets/sokrat.ico \
            --paths server --paths windows \
            --add-data "app/Resources/Fonts:Fonts" --add-data "windows/assets:assets" \
            --collect-data langdetect --collect-binaries ctranslate2 \
            --exclude-module tkinter \
            --distpath build/win --workpath build/pyi \
            windows/sokrat_win.py 2>&1 | tee -a build/ci.log
          du -sh build/win/Sokrat

      - name: Проверка собранного Sokrat.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\win\Sokrat\Sokrat.exe" -ArgumentList "--selftest","--model","model","--report","build\selftest-exe.txt" -Wait -PassThru
          if (Test-Path build\selftest-exe.txt) { Get-Content build\selftest-exe.txt -Encoding utf8; Get-Content build\selftest-exe.txt -Encoding utf8 | Add-Content build\ci.log -Encoding utf8 }
          exit $p.ExitCode

      - name: Установщик
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [[ -f "$ISCC" ]] || choco install innosetup -y --no-progress 2>&1 | tail -3
          SOKRAT_VERSION="$(cat VERSION)" "$ISCC" windows/installer.iss 2>&1 | tee -a build/ci.log
          ls -la build/Sokrat-Setup-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Sokrat-windows-x64
          path: build/Sokrat-Setup-x64.exe
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest
          path: build/selftest-*
          retention-days: 7

      - name: Ошибки сборки — в сводку
        if: failure()
        run: |
          [[ -f build/ci.log ]] || exit 0
          grep -E "error|Error|ERROR|failed|Traceback|No such|assert" build/ci.log | head -40 > build/err.txt || true
          [[ -s build/err.txt ]] || tail -40 build/ci.log > build/err.txt
          msg="$(sed -e 's/%/%25/g' build/err.txt | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Лог сборки Windows::$msg"

  release:
    name: Публикация релиза
    # Релиз создаётся сам, когда в файле VERSION появляется новый номер версии.
    if: github.ref == 'refs/heads/main'
    needs: [app, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Есть ли уже такой релиз
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.exists == 'false'
        with:
          pattern: Sokrat-*
          merge-multiple: true
      - name: Релиз
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" Sokrat-*.dmg Sokrat-Setup-x64.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Сократ $TAG" \
            --notes "**Sokrat-arm64.dmg** — для Mac на Apple Silicon (M1–M4).
          **Sokrat-intel.dmg** — для Mac на Intel.
          **Sokrat-Setup-x64.exe** — для Windows 10/11 (64-бит).

          Mac: откройте .dmg и перетащите «Сократ» в «Программы». Windows: запустите установщик. Подробности — в README."
