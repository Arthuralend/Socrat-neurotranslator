name: Сборка Сократа

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash  # bash -eo pipefail: ошибка в конвейере с tee роняет шаг

env:
  HF_MODEL: facebook/nllb-200-distilled-1.3B

jobs:
  model:
    name: Модель NLLB-200 → CTranslate2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: model
          key: nllb-1.3B-ct2-int8-${{ hashFiles('scripts/convert_model.sh') }}

      - name: Конвертация
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/convert_model.sh model "$HF_MODEL"

      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: model
          retention-days: 2
          compression-level: 0

  app:
    name: Приложение (${{ matrix.arch }})
    needs: model
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: model

      - name: Встроенный Python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          scripts/bundle_python.sh build/python 2>&1 | tee -a build/ci.log

      - name: Сборка приложения
        run: |
          VERSION="$(cat VERSION)" scripts/build_app.sh build/python model build 2>&1 | tee -a build/ci.log

      - name: Проверка перевода
        run: scripts/smoke_test.sh "build/Сократ.app" 2>&1 | tee -a build/ci.log

      - name: DMG
        run: scripts/make_dmg.sh "build/Сократ.app" "build/Sokrat-${{ matrix.arch }}.dmg" 2>&1 | tee -a build/ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: Sokrat-${{ matrix.arch }}
          path: build/Sokrat-${{ matrix.arch }}.dmg
          compression-level: 0

      - name: Ошибки сборки — в сводку
        if: failure()
        run: |
          [[ -f build/ci.log ]] || exit 0
          grep -E "error|Error|ERROR|failed|Traceback|No such" build/ci.log | head -40 > build/err.txt || true
          [[ -s build/err.txt ]] || tail -40 build/ci.log > build/err.txt
          msg="$(sed -e 's/%/%25/g' build/err.txt | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Лог сборки::$msg"

  release:
    name: Публикация релиза
    # Релиз создаётся сам, когда в файле VERSION появляется новый номер версии.
    if: github.ref == 'refs/heads/main'
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Есть ли уже такой релиз
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.exists == 'false'
        with:
          pattern: Sokrat-*
          merge-multiple: true
      - name: Релиз
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" Sokrat-*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Сократ $TAG" \
            --notes "**Sokrat-arm64.dmg** — для Mac на Apple Silicon (M1–M4).
          **Sokrat-intel.dmg** — для Mac на Intel.

          Откройте .dmg, перетащите «Сократ» в «Программы». Первый запуск и разрешения — в README."
